services:
  mysql:
    image: mysql:8.4
    container_name: sac_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sac
      MYSQL_USER: sac_user
      MYSQL_PASSWORD: sac_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: sac_phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: sac_user
      PMA_PASSWORD: sac_password
    ports:
      - "8080:80"

  mongodb:
    image: mongo:7
    container_name: sac_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./dataset:/import:ro

  mongo-express:
    image: mongo-express:1.0.2
    container_name: sac_mongo_express
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
    ports:
      - "8081:8081"

volumes:
  mysql_data:
  mongo_data:
